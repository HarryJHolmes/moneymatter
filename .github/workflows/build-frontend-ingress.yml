name: Build frontend (ingress)
on:
  workflow_dispatch:
  push:
    branches: [ingress]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: self-hosting/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/harryjholmes/moneymatter-fe-ingress:latest
